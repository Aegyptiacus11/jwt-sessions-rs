# Every push to main and every pull request: formatting, clippy on each set of features, and
# the tests, with the refresh store checked on SQLite and on a real Postgres.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml: nothing is published unless every job here passes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The release's tag check
        run: .github/scripts/test-check-tag.sh
      - run: cargo fmt --check
      - name: clippy, each set of features
        run: |
          set -euo pipefail
          for features in "" "--features axum" "--features sqlx" "--all-features"; do
            echo "::group::clippy $features"
            # shellcheck disable=SC2086  # the words are separate arguments
            cargo clippy --all-targets --locked $features -- -D warnings
            echo "::endgroup::"
          done
      - name: The package crates.io would get builds on its own
        run: cargo publish --dry-run --locked --all-features

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      JWT_SESSIONS_TEST_POSTGRES_URL: postgres://postgres:test@127.0.0.1:15433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Postgres
        run: |
          set -euo pipefail
          docker run -d --name pg -p 127.0.0.1:15433:5432 -e POSTGRES_PASSWORD=test postgres:18.6-alpine
          for _ in $(seq 1 60); do
            if docker exec pg psql -U postgres -qc 'select 1' > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo "::error::Postgres did not start"
          docker logs --tail 50 pg
          exit 1
      - run: cargo test --locked
      - run: cargo test --locked --all-features
      - name: The Postgres tests really ran
        run: |
          set -euo pipefail
          tables=$(docker exec pg psql -U postgres -Atc \
            "select count(*) from information_schema.tables where table_name like 't%refresh_tokens'")
          if [ "$tables" -lt 8 ]; then
            echo "::error::expected the 8 Postgres cases to make their tables, found $tables"
            exit 1
          fi
